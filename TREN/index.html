<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Зум выключен намеренно: щипок двумя пальцами во время подхода
         увеличивал интерфейс, и вернуть его было нечем — приложение
         рассчитано на одну колонку. `maximum-scale=1` работает в Chrome
         (веб-режим и TWA), `user-scalable=no` оставлен для старых
         версий. iOS Safari оба атрибута игнорирует с iOS 10 — там
         зум отключить нельзя, это решение Apple про доступность. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- color-scheme обязателен: приложение умеет светлую тему, а без него
         браузер рисует системные элементы (скроллбары, поля форм) тёмными
         поверх светлого фона. -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="description" content="МЕЗО — офлайн-трекер тренировок: журнал подходов, вес, повторы, отдых. Работает без интернета." />

    <!-- Установка на экран в iOS. Без этих трёх подсказок Safari открывает
         приложение с адресной строкой и кнопками браузера, то есть от
         приложения остаётся только вкладка. Проверено чтением, не измерением:
         iOS-устройства под рукой нет. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="МЕЗО" />

    <meta property="og:type" content="website" />

    <title>МЕЗО · Классический сплит</title>

      белого кадра) и каркас главного экрана. React заменяет #root сразу после
      монтирования, поэтому каркас виден только на время загрузки бандла.
      Повторяет структуру главной: шапка, кольцо прогресса, карточка тренировки.
    -->

      .sk { border-radius: 18px; background: #10141B; position: relative; overflow: hidden; }
      .sk::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .055), transparent);
        animation: sk-shimmer 1.3s ease-in-out infinite;
      }
      @keyframes sk-shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .sk::after { animation: none; } }
      .sk-wrap { padding: 18px 16px 120px; display: flex; flex-direction: column; gap: 16px; }
      .sk-top { display: flex; justify-content: space-between; align-items: center; }
      .sk-logo { width: 92px; height: 20px; border-radius: 8px; }
      .sk-btn { width: 48px; height: 48px; border-radius: 14px; }
      .sk-ring { width: min(240px, 68vw); aspect-ratio: 1; border-radius: 50%; margin: 8px auto 4px; }
      .sk-label { width: 44%; height: 11px; border-radius: 6px; }
      .sk-title { width: 62%; height: 30px; border-radius: 10px; }
      .sk-line { height: 13px; border-radius: 6px; }
      .sk-line.s90 { width: 90%; } .sk-line.s70 { width: 70%; } .sk-line.s45 { width: 45%; }
      .sk-card { padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; }
      .sk-cta { height: 56px; border-radius: 16px; background: #1a1f14; }
      [data-theme='light'] .sk { background: #FFFFFF; }
      [data-theme='light'] .sk::after { background: linear-gradient(90deg, transparent, rgba(23, 34, 41, .045), transparent); }
      [data-theme='light'] .sk-cta { background: #EAF0D8; }
    </style>

      // значения лежат в записи открытым текстом — ровно ради этого случая.
      //
      // Палитра нужна и на экране блокировки: он обязан быть в том наборе,
      // который выбран в профиле. Собственных цветов у него больше нет.

          // скрипте: девять значений в двух местах разъехались бы при первой
          // же правке палитры, и заставка показала бы чужой цвет.
          // Фон и цвет панели берутся из каскада CSS, а не из таблицы здесь:
          // девять значений в двух местах разъехались бы при первой правке
          // палитры, и заставка показала бы чужой фон.
          //
          // Но встроенный скрипт выполняется в <head> раньше, чем разобран
          // <link rel="stylesheet">: в собранном index.html стиль стоит ниже
          // скрипта, и на этом шаге `--bg` ещё пуст. Замерено на устройстве:
          // панель оставалась #000000, пока фон палитры был #140A08, и стык
          // панели с подложкой был виден. Поэтому читаем каскад, когда он
          // доступен, а если нет — повторяем после разбора документа, и до
          // этого держим запасное значение, чтобы заставка не мигала.
          var ЗАПАСНЫЕ = { dark: '#000000', light: '#F2F5F4' };
          var применить = function () {
            var cs = getComputedStyle(document.documentElement);
            var bg = cs.getPropertyValue('--bg').trim() ||

          // контексте: пока человек ничего не выбрал, выигрывает она.
          if (!fx && !env) {
            if (matchMedia('(prefers-reduced-transparency: reduce)').matches) fx = 'off';
          } else if (!fx && env.fx === undefined) {
            if (matchMedia('(prefers-reduced-transparency: reduce)').matches) fx = 'off';
          }
          if (fx) document.documentElement.dataset.fx = fx;
        } catch (e) { /* приватный режим — остаёмся на тёмной без эффектов */ }
      })();
    </script>
